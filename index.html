<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дело о пустых стульях</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #18191c;
            color: #e4e6eb;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 90vh;
        }
        .card {
            background: #242526;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 1px solid #3a3b3c;
        }
        .scene-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 14px;
            background-color: #18191c;
        }
        .badge {
            display: inline-block;
            background: #e63946;
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        h2 { margin-top: 0; margin-bottom: 10px; font-size: 20px; color: #ffffff; }
        p { line-height: 1.5; font-size: 15px; color: #b0b3b8; margin-top: 0; }
        .btn {
            display: block;
            width: 100%;
            background: #3a3b3c;
            color: #ffffff;
            border: 1px solid #4e4f50;
            padding: 13px;
            margin-top: 10px;
            border-radius: 12px;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            line-height: 1.4;
        }
        .btn-correct { border-color: #2ecc71 !important; background: rgba(46, 204, 113, 0.15) !important; }
        .btn-wrong { border-color: #e63946 !important; background: rgba(230, 57, 70, 0.15) !important; }
        .btn-primary { background: #2d88ff; border: none; text-align: center; font-weight: bold; margin-top: 18px; }
        .feedback {
            margin-top: 14px;
            padding: 12px;
            border-radius: 10px;
            background: #2b3945;
            color: #8ab4f8;
            font-size: 14px;
            line-height: 1.45;
            display: none;
        }
    </style>
</head>
<body>

<div class="card" id="game-box">
    <img src="cover.jpg" id="scene-img" class="scene-img" alt="Сцена">
    <span class="badge" id="step-badge">Досье • Особой важности</span>
    <h2 id="title">Дело о пустых стульях</h2>
    <p id="text">Директор компании «Вектор» нанял вас для кадрового аудита. Старые сотрудники уходят, воронка найма пуста, а кандидаты срывают сделки. Соберите все 8 улик!</p>
    <div id="options"></div>
    <div id="feedback" class="feedback"></div>
    <button class="btn btn-primary" id="next-btn" onclick="nextScene()">Начать расследование</button>
</div>
<script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
        tg.expand();
        const firstName = tg.initDataUnsafe?.user?.first_name;
        if (firstName) {
            document.getElementById("text").innerText = `${firstName}, директор компании «Вектор» нанял вас для кадрового аудита. Старые сотрудники уходят, воронка пуста, а сильные кандидаты отказываются от офферов. Соберите все 8 улик!`;
        }
    }

    let score = 0;
    let currentScene = -1;

    const scenes = [
        {
            img: "scene1.jpg",
            badge: "Улика 1 из 8 • Воронка найма",
            title: "Иллюзия высокого дохода",
            text: "В вакансии указано: «Доход до 180 000 ₽, молодой коллектив, стрессоустойчивость». Просмотров много, но конверсия в отклик менее 1%, а после звонка HR отсеиваются еще 80%. В чем корень проблемы?",
            options: [
                { text: "Высокая планка дохода в заголовке отпугивает кандидатов с синдромом самозванца и сужает первичный охват", correct: false, reply: "Неверно. Квалифицированных специалистов пугает не крупная сумма, а непрозрачная структура выплат." },
                { text: "Алгоритмы работных площадок занижают выдачу объявлений без корпоративного видео и подробного описания соцпакета", correct: false, reply: "Мимо. Просмотров у вакансии достаточно, значит индексация в порядке — хромает само предложение." },
                { text: "Формулировка «до» маскирует низкий оклад с жестким KPI, а «стрессоустойчивость» сигнализирует о переработках", correct: true, reply: "В точку! Скрытый демпинг по окладу и шаблонные маркеры выгорания разрушают доверие к компании еще до встречи. (+1 улика)" }
            ]
        },
        {
            img: "scene3.jpg",
            badge: "Улика 2 из 8 • Рынок труда",
            title: "Парадокс тысячи резюме",
            text: "В папке лежат 400 откликов от выпускников курсов, но позиция ведущего аналитика открыта 7 месяцев. Начальник жалуется: «Людей полно, а работать некому!». С каким явлением столкнулась компания?",
            options: [
                { text: "Структурный дисбаланс и разрыв компетенций: переизбыток новичков на фоне дефицита опытных специалистов", correct: true, reply: "Верно! Квалификационную яму нельзя переждать — компании нужно либо обучать стажеров, либо пересматривать бюджет. (+1 улика)" },
                { text: "Затяжная фрикционная безработица, вызванная сезонной миграцией кадров и долгим поиском лучших условий", correct: false, reply: "Неверно. Фрикционная безработица длится 1–2 месяца и связана со сменой работы, а не с нехваткой навыков." },
                { text: "Скрытая отраслевая безработица из-за внедрения нейросетей и сокращения штатных расписаний у конкурентов", correct: false, reply: "Мимо. Автоматизация снижала бы потребность в людях, а у компании острая нехватка профильных экспертов." }
            ]
        },
        {
            img: "scene2.jpg",
            badge: "Улика 3 из 8 • Проведение интервью",
            title: "Стресс-допрос в переговорной",
            text: "Руководитель опоздал на 15 минут, спросил кандидатку о планах на декрет и дал тестовое — к понедельнику написать стратегию запуска нового продукта компании. Кандидатка ушла. Что здесь критичнее всего?",
            options: [
                { text: "Нарушение регламента тайминга и отсутствие заранее подготовленного бланка для оценки технических навыков", correct: false, reply: "Опоздание неприятно, но главная причина ухода кроется в нарушении закона и этики тестовых заданий." },
                { text: "Прямое нарушение ст. 64 ТК РФ личными вопросами и попытка получить бесплатное бизнес-решение под видом теста", correct: true, reply: "Точно! Дискриминационные вопросы незаконны, а объемное задание на реальном проекте считывается как кража идей. (+1 улика)" },
                { text: "Отсутствие HR-специалиста на встрече, который должен сглаживать жесткую манеру общения линейного руководителя", correct: false, reply: "Присутствие рекрутера помогает, но корень срыва — незаконные вопросы и эксплуатация труда соискателя." }
            ]
        },
        {
            img: "scene2.jpg",
            badge: "Улика 4 из 8 • Методика оценки",
            title: "Ошибка «своего парня»",
            text: "Недавно в отдел продаж взяли сотрудника, но уволили через 3 недели за провал планов. В заметках с интервью написано: «Отличный парень! Закончил мой вуз, болеет за тот же клуб — берем без кейсов». В чем просчет?",
            options: [
                { text: "Сработал эффект края: руководитель оценил только яркое приветствие и уверенное прощание в конце диалога", correct: false, reply: "Мимо. Здесь решение принималось не по первым минутам речи, а из-за общих биографических фактов." },
                { text: "Сработала ошибка центральной тенденции: интервьюер усреднил оценки всех кандидатов из-за усталости от встреч", correct: false, reply: "Неверно. Кандидату не усредняли балл, а наоборот поставили высшую оценку авансом без проверки навыков." },
                { text: "Сработал эффект ореола и сходства: личная симпатия подменила проверку реального опыта по методике STAR", correct: true, reply: "Блестяще! Оценка общих хобби и вуза вместо разбора рабочих кейсов по модели STAR ведет к провальному найму. (+1 улика)" }
            ]
        },
        {
            img: "scene4.jpg",
            badge: "Улика 5 из 8 • Правила для соискателя",
            title: "Провал сильного резюме",
            text: "На вопрос о причинах ухода кандидат с хорошим опытом 10 минут обвинял бывшего шефа, а на вопрос об ожиданиях от задач ответил: «Вам виднее, главное — платите вовремя». Почему отказ оправдан?",
            options: [
                { text: "Соискатель нарушил деловой этикет, подняв тему финансовой мотивации до обсуждения ключевых KPI отдела", correct: false, reply: "Говорить о деньгах на встрече нормально. Настоящая причина отказа — токсичность и безынициативность." },
                { text: "Соискатель показал перекладывание ответственности, конфликтность и полное отсутствие подготовки к интервью", correct: true, reply: "Верно! О прошлом месте говорят языком фактов без оскорблений, а задачи компании изучают до входа в переговорную. (+1 улика)" },
                { text: "Соискатель отказался предоставить письменные контакты прошлых коллег на этапе первичного знакомства с HR", correct: false, reply: "Сбор рекомендаций обычно проходит перед оффером — кандидата подвела именно провальная самопрезентация." }
            ]
        },
        {
            img: "scene3.jpg",
            badge: "Улика 6 из 8 • Барьеры рынка труда",
            title: "Код «Культурное несоответствие»",
            text: "В CRM настроен автофильтр: резюме людей старше 45 лет и женщин с маленькими детьми падают в папку «Не впишется в динамичную культуру». К чему это приводит компанию?",
            options: [
                { text: "На фоне демографической ямы бизнес сам отсекает стабильных профи из-за эйджизма и гендерных стереотипов", correct: true, reply: "В яблочко! Прикрываясь «корпоративной культурой», компания теряет лояльных экспертов и годами не закрывает штат. (+1 улика)" },
                { text: "Автоматический прескрининг ускоряет закрытие позиций, освобождая время рекрутеров для хантинга редких кадров", correct: false, reply: "Наоборот! Вакансии простаивают месяцами, потому что робот выбрасывает подходящих специалистов в корзину." },
                { text: "Жесткий возрастной ценз помогает удерживать фонд оплаты труда в рамках бюджета за счет найма выпускников", correct: false, reply: "Молодых специалистов сейчас рекордно мало на рынке, и их зарплатные ожидания растут быстрее всего." }
            ]
        },
        {
            img: "scene1.jpg",
            badge: "Улика 7 из 8 • Удержание персонала",
            title: "Бунт «старой гвардии»",
            text: "Увольняются сразу два ключевых разработчика, работавших 4 года. Они узнали, что новичку с рынка дали оффер на 35% выше их текущей зарплаты. Какую ошибку допустило руководство?",
            options: [
                { text: "Юридический отдел не включил в трудовые договоры пункт о строгой конфиденциальности персональных окладов", correct: false, reply: "Запрещать сотрудникам обсуждать свою зарплату нельзя по закону, и это не устраняет несправедливость." },
                { text: "Руководитель согласовал расширенный оффер внешнему кандидату в обход общего собрания с ведущими тимлидами", correct: false, reply: "Оперативность оффера — это плюс. Проблема в том, что старым сотрудникам годами не пересматривали условия." },
                { text: "Возникла зарплатная компрессия: отсутствие индексации у штатных профи при переплате новичкам разрушило ядро", correct: true, reply: "Точно! Удерживать и вовремя индексировать зарплату опытным сотрудникам всегда выгоднее, чем искать им замену. (+1 улика)" }
            ]
        },
        {
            img: "scene4.jpg",
            badge: "Улика 8 из 8 • Финал сделки",
            title: "Исчезнувший в понедельник",
            text: "Финальный кандидат прошел 4 этапа, принял оффер за две недели до выхода, но в понедельник не вышел на работу и перестал брать трубку (гостинг). Что упустила компания?",
            options: [
                { text: "Кадровая служба не запросила электронную выписку из трудовой книжки в день устного подтверждения оффера", correct: false, reply: "Требовать документы до оформления нельзя, и сама выписка никак не удержит человека от ухода к конкурентам." },
                { text: "Затянутый отбор и отсутствие контакта до дня выхода позволили конкурентам перекупить кандидата контроффером", correct: true, reply: "Дело раскрыто! Двухнедельная пауза без пребординга и связи с командой приводит к потере трети финалистов. (+1 улика)" },
                { text: "Финальное предложение отправили без ограничения срока действия в 24 часа для быстрого принятия решения", correct: false, reply: "Кандидат ведь сразу принял оффер — проблема случилась позже, пока он две недели оставался без внимания компании." }
            ]
        }
    ];

    function nextScene() {
        currentScene++;
        document.getElementById("feedback").style.display = "none";
        document.getElementById("next-btn").style.display = "none";

        if (currentScene < scenes.length) {
            const s = scenes[currentScene];
            document.getElementById("scene-img").src = s.img;
            document.getElementById("step-badge").innerText = s.badge;
            document.getElementById("title").innerText = s.title;
            document.getElementById("text").innerText = s.text;

            const optsDiv = document.getElementById("options");
            optsDiv.innerHTML = "";
            s.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "btn";
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(opt, btn);
                optsDiv.appendChild(btn);
            });
        } else {
            finishGame();
        }
    }

    function selectOption(opt, clickedBtn) {
        if (opt.correct) {
            score++;
            clickedBtn.classList.add("btn-correct");
        } else {
            clickedBtn.classList.add("btn-wrong");
        }
        document.querySelectorAll("#options .btn").forEach(b => b.disabled = true);

        const fb = document.getElementById("feedback");
        fb.innerText = opt.reply;
        fb.style.display = "block";

        const nextBtn = document.getElementById("next-btn");
        nextBtn.innerText = currentScene === scenes.length - 1 ? "Перейти к вердикту" : "Следующая улика";
        nextBtn.style.display = "block";
    }

    function finishGame() {
        document.getElementById("scene-img").src = "cover.jpg";
        document.getElementById("step-badge").innerText = "Расследование завершено";
        document.getElementById("title").innerText = `Собрано улик: ${score} из ${scenes.length}`;
        document.getElementById("text").innerText = "Аудит окончен! Нажмите кнопку ниже, чтобы передать досье Совету директоров и получить HR-разбор в чате.";
        document.getElementById("options").innerHTML = "";

        const sendBtn = document.createElement("button");
        sendBtn.className = "btn btn-primary";
        sendBtn.innerText = "Отправить досье в чат";
        sendBtn.onclick = () => {
            if (tg) {
                tg.sendData(JSON.stringify({ score: score, total: scenes.length }));
            }
        };
        document.getElementById("options").appendChild(sendBtn);
    }
</script>
</body>
</html>
