<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дело о пустых стульях</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #18191c;
            color: #e4e6eb;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 90vh;
        }
        .card {
            background: #242526;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 1px solid #3a3b3c;
        }
        .scene-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 14px;
            background-color: #18191c;
        }
        .badge {
            display: inline-block;
            background: #e63946;
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        h2 { margin-top: 0; margin-bottom: 10px; font-size: 20px; color: #ffffff; }
        p { line-height: 1.5; font-size: 15px; color: #b0b3b8; margin-top: 0; }
        .btn {
            display: block;
            width: 100%;
            background: #3a3b3c;
            color: #ffffff;
            border: 1px solid #4e4f50;
            padding: 13px;
            margin-top: 10px;
            border-radius: 12px;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            line-height: 1.4;
        }
        .btn-correct { border-color: #2ecc71 !important; background: rgba(46, 204, 113, 0.15) !important; }
        .btn-wrong { border-color: #e63946 !important; background: rgba(230, 57, 70, 0.15) !important; }
        .btn-primary { background: #2d88ff; border: none; text-align: center; font-weight: bold; margin-top: 18px; }
        .feedback {
            margin-top: 14px;
            padding: 12px;
            border-radius: 10px;
            background: #2b3945;
            color: #8ab4f8;
            font-size: 14px;
            line-height: 1.45;
            display: none;
        }
    </style>
</head>
<body>

<div class="card" id="game-box">
    <img src="cover.jpg" id="scene-img" class="scene-img" alt="Сцена">
    <span class="badge" id="step-badge">Досье • Особой важности</span>
    <h2 id="title">Дело о пустых стульях</h2>
    <p id="text">Директор компании «Вектор» нанял вас для кадрового аудита. Старые сотрудники уходят, воронка найма пуста, а кандидаты срывают сделки. Соберите все 8 улик!</p>
    <div id="options"></div>
    <div id="feedback" class="feedback"></div>
    <button class="btn btn-primary" id="next-btn" onclick="nextScene()">Начать расследование</button>
</div>
<script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
        tg.expand();
        const firstName = tg.initDataUnsafe?.user?.first_name;
        if (firstName) {
            document.getElementById("text").innerText = `${firstName}, директор компании «Вектор» нанял вас для кадрового аудита. Старые сотрудники уходят, воронка пуста, а сильные кандидаты отказываются от офферов. Соберите все 8 улик!`;
        }
    }

    let score = 0;
    let currentScene = -1;

    const scenes = [
        {
            img: "scene1.jpg",
            badge: "Улика 1 из 8 • Воронка найма",
            title: "Иллюзия высокого дохода",
            text: "В вакансии указано: «Доход до 180 000 ₽, молодой коллектив, стрессоустойчивость». Просмотров много, но конверсия в отклик менее 1%, а после звонка HR отсеиваются еще 80%. В чем корень проблемы?",
            options: [
                { text: "Высокая сумма пугает специалистов с синдромом самозванца", correct: false, reply: "Неверно. Кандидатов отпугивает не высокая цифра, а манипуляции со структурой дохода." },
                { text: "Предлог «до» скрывает оклад 45 000 ₽ с невыполнимым KPI, а «стрессоустойчивость» считывается как маркер переработок", correct: true, reply: "В точку! Скрытый демпинг по фиксу и клише токсичной среды разрушают доверие к HR-бренду еще до интервью. (+1 улика)" },
                { text: "Алгоритмы сайтов пессимизируют вакансии без видеовизитки", correct: false, reply: "Мимо. Просмотры есть, значит проблема именно в ценностном предложении (EVP)." }
            ]
        },
        {
            img: "scene3.jpg",
            badge: "Улика 2 из 8 • Рынок труда",
            title: "Парадокс тысячи резюме",
            text: "В папке лежат 400 откликов от выпускников курсов, но позиция ведущего аналитика открыта 7 месяцев. Начальник жалуется: «Людей полно, а работать некому!». С каким явлением рынка труда столкнулась компания?",
            options: [
                { text: "Структурная безработица и квалификационный разрыв (skills gap): избыток джунов при остром дефиците мидл/сеньор кадров", correct: true, reply: "Верно! Дисбаланс компетенций нельзя закрыть ожиданием — нужно либо растить кадры внутри, либо менять бюджет. (+1 улика)" },
                { text: "Сезонная фрикционная безработица из-за периода отпусков", correct: false, reply: "Неверно. Фрикционная безработица краткосрочна, а здесь системный перекос длиной в полгода." },
                { text: "Скрытая безработица из-за автоматизации процессов", correct: false, reply: "Мимо. Автоматизация наоборот снижала бы потребность в найме." }
            ]
        },
        {
            img: "scene2.jpg",
            badge: "Улика 3 из 8 • Проведение интервью",
            title: "Стресс-допрос в переговорной",
            text: "Руководитель опоздал на 15 минут, спросил кандидатку «Не собираетесь ли вы в декрет?» и дал тестовое — разработать реальную стратегию нового продукта компании к понедельнику. Кандидатка ушла. Что здесь критичнее всего?",
            options: [
                { text: "Слишком сжатый дедлайн по тестовому заданию без шаблонов", correct: false, reply: "Дедлайн вторичен. Главная проблема в незаконности вопросов и использовании бесплатного труда." },
                { text: "Нарушение ст. 64 ТК РФ (дискриминационный вопрос) и подмена оценки навыков бесплатным решением бизнес-задач", correct: true, reply: "Точно! Вопросы о планах на семью незаконны, а тестовое на реальном продукте воспринимается как кража идей. (+1 улика)" },
                { text: "Отсутствие рекрутера-модератора на техническом собеседовании", correct: false, reply: "Корень срыва сделки — прямая дискриминация и неэтичное тестовое от руководителя." }
            ]
        },
        {
            img: "scene2.jpg",
            badge: "Улика 4 из 8 • Методика оценки",
            title: "Ошибка «своего парня»",
            text: "Недавно в отдел продаж взяли сотрудника, но уволили через 3 недели за провал планов. В заметках с интервью написано: «Отличный парень! Закончил мой вуз, болеет за тот же клуб — берем без кейсов». Какую ошибку допустил интервьюер?",
            options: [
                { text: "Эффект края (запоминание только первой и последней минуты)", correct: false, reply: "Мимо. Оценка строилась на личной симпатии и общих чертах." },
                { text: "Эффект ореола и проекции сходства вместо структурированного интервью по компетенциям (методика STAR)", correct: true, reply: "Блестяще! Оценка харизмы вместо проверки реального опыта по модели STAR ведет к дорогим ошибкам найма. (+1 улика)" },
                { text: "Ошибка центральной тенденции (усреднение оценок всех кандидатов)", correct: false, reply: "Неверно. Кандидату наоборот авансом поставили высший балл." }
            ]
        },
        {
            img: "scene4.jpg",
            badge: "Улика 5 из 8 • Правила для соискателя",
            title: "Провал сильного резюме",
            text: "На вопрос о причинах ухода кандидат с хорошим опытом 10 минут обвинял бывшего шефа, а на вопрос об ожиданиях от задач ответил: «Вам виднее, главное — платите вовремя». Почему отказ оправдан?",
            options: [
                { text: "Кандидат показал внешний локус контроля (перекладывание вины), конфликтность и нулевую подготовку к встрече", correct: true, reply: "Верно! Правило интервью — говорить о прошлом опыте языком фактов без токсичности и изучать компанию заранее. (+1 улика)" },
                { text: "Кандидат нарушил этикет, заговорив о деньгах до оффера", correct: false, reply: "Обсуждать деньги нормально. Проблема именно в токсичности и пассивной позиции." },
                { text: "Соискатель не принес бумажные рекомендательные письма", correct: false, reply: "Бумажные письма не обязательны — кандидата подвела самопрезентация." }
            ]
        },
        {
            img: "scene3.jpg",
            badge: "Улика 6 из 8 • Барьеры рынка труда",
            title: "Код «Культурное несоответствие»",
            text: "В CRM настроен автофильтр: резюме людей старше 45 лет и женщин с маленькими детьми падают в папку «Не впишется в динамичную культуру». К чему это приводит компанию?",
            options: [
                { text: "К ускорению закрытия вакансий за счет экономии времени HR", correct: false, reply: "Наоборот! Вакансии висят месяцами, так как фильтр отсекает профессионалов." },
                { text: "В условиях демографической ямы компания режет воронку эйджизмом и стереотипами, теряя самых стабильных кадров", correct: true, reply: "В яблочко! Маскировка дискриминации под «корпоративную культуру» лишает бизнес лояльных специалистов. (+1 улика)" },
                { text: "К снижению фонда оплаты труда за счет найма студентов", correct: false, reply: "Молодежи на рынке сейчас меньше всего из-за демографического спада — штат остается пустым." }
            ]
        },
        {
            img: "scene1.jpg",
            badge: "Улика 7 из 8 • Удержание персонала",
            title: "Бунт «старой гвардии»",
            text: "Увольняются сразу два ключевых разработчика, работавших 4 года. Они узнали, что новичку с рынка дали оффер на 35% выше их текущей зарплаты. Какую ошибку допустило руководство?",
            options: [
                { text: "Не ввело штрафы за разглашение зарплаты внутри коллектива", correct: false, reply: "Штрафы незаконны по ТК РФ и не решают проблему несправедливой оплаты." },
                { text: "Компрессия (инверсия) зарплат: отсутствие индексации у «старичков» при рыночных премиях новичкам демотивирует ядро команды", correct: true, reply: "Точно! Своевременный пересмотр окладов текущих экспертов обходится в разы дешевле поиска замены. (+1 улика)" },
                { text: "Слишком быстрая выдача оффера новичку без согласования с отделом", correct: false, reply: "Быстрый оффер — это плюс. Ошибка в отсутствии системы грейдов и индексации." }
            ]
        },
        {
            img: "scene4.jpg",
            badge: "Улика 8 из 8 • Финал сделки",
            title: "Исчезнувший в понедельник",
            text: "Финальный кандидат прошел 4 этапа, принял оффер за две недели до выхода, но в понедельник не вышел на работу и перестал брать трубку (гостинг). Что упустила компания?",
            options: [
                { text: "Затянутый цикл из 4 этапов и отсутствие пребординга (связи до выхода) позволили конкурентам перехватить его контроффером", correct: true, reply: "Дело раскрыто! «Тишина» между принятием оффера и выходом на работу ведет к срыву до трети сделок. (+1 улика)" },
                { text: "Не забрала оригинал бумажной трудовой книжки в день согласия", correct: false, reply: "До подписания договора требовать документы нельзя." },
                { text: "Отправила оффер во вторник вместо пятницы", correct: false, reply: "День недели не спасает от контрофферов, если с кандидатом не держат связь до выхода." }
            ]
        }
    ];

    function nextScene() {
        currentScene++;
        document.getElementById("feedback").style.display = "none";
        document.getElementById("next-btn").style.display = "none";

        if (currentScene < scenes.length) {
            const s = scenes[currentScene];
            document.getElementById("scene-img").src = s.img;
            document.getElementById("step-badge").innerText = s.badge;
            document.getElementById("title").innerText = s.title;
            document.getElementById("text").innerText = s.text;

            const optsDiv = document.getElementById("options");
            optsDiv.innerHTML = "";
            s.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "btn";
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(opt, btn);
                optsDiv.appendChild(btn);
            });
        } else {
            finishGame();
        }
    }

    function selectOption(opt, clickedBtn) {
        if (opt.correct) {
            score++;
            clickedBtn.classList.add("btn-correct");
        } else {
            clickedBtn.classList.add("btn-wrong");
        }
        document.querySelectorAll("#options .btn").forEach(b => b.disabled = true);

        const fb = document.getElementById("feedback");
        fb.innerText = opt.reply;
        fb.style.display = "block";

        const nextBtn = document.getElementById("next-btn");
        nextBtn.innerText = currentScene === scenes.length - 1 ? "Перейти к вердикту" : "Следующая улика";
        nextBtn.style.display = "block";
    }

    function finishGame() {
        document.getElementById("scene-img").src = "cover.jpg";
        document.getElementById("step-badge").innerText = "Расследование завершено";
        document.getElementById("title").innerText = `Собрано улик: ${score} из ${scenes.length}`;
        document.getElementById("text").innerText = "Аудит окончен! Нажмите кнопку ниже, чтобы передать досье Совету директоров и получить HR-разбор в чате.";
        document.getElementById("options").innerHTML = "";

        const sendBtn = document.createElement("button");
        sendBtn.className = "btn btn-primary";
        sendBtn.innerText = "Отправить досье в чат";
        sendBtn.onclick = () => {
            if (tg) {
                tg.sendData(JSON.stringify({ score: score, total: scenes.length }));
            }
        };
        document.getElementById("options").appendChild(sendBtn);
    }
</script>
</body>
</html>
